[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "extract-eval"
dynamic = ["version"]
description = "Evaluate structured extraction (LLM/OCR/document-AI) against ground truth: Hungarian line-item matching, per-field P/R/F1, bootstrap CIs, run comparison, CI gating."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ashik Sharon M" }]
keywords = ["llm-evaluation", "information-extraction", "document-ai", "evaluation-metrics", "benchmarking"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24", "scipy>=1.10", "rapidfuzz>=3.0", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=5", "hypothesis>=6", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]
demo = ["gradio>=4.44,<7"]

[project.scripts]
extract-eval = "extract_eval.cli:main"

[project.urls]
Homepage = "https://github.com/ashiksharonm/extract-eval"
Issues = "https://github.com/ashiksharonm/extract-eval/issues"
Changelog = "https://github.com/ashiksharonm/extract-eval/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/extract_eval/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/extract_eval"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=extract_eval --cov-report=term-missing"

[tool.coverage.report]
fail_under = 85

[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_ignores = true
check_untyped_defs = true
ignore_missing_imports = true
files = ["src"]
