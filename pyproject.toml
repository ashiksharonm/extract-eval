[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "extract-eval"
version = "0.1.0"
description = "Evaluate structured extraction (LLM/OCR/document-AI) against ground truth: Hungarian line-item matching, per-field P/R/F1, bootstrap CIs, run comparison, CI gating."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ashik Sharon M" }]
keywords = ["llm-evaluation", "information-extraction", "document-ai", "evaluation-metrics", "benchmarking"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24", "scipy>=1.10", "rapidfuzz>=3.0", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7", "hypothesis>=6", "ruff>=0.5"]

[project.scripts]
extract-eval = "extract_eval.cli:main"

[project.urls]
Homepage = "https://github.com/ashiksharonm/extract-eval"

[tool.hatch.build.targets.wheel]
packages = ["src/extract_eval"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
