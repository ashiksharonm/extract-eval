# Pushes space/ to a Hugging Face Space, only when HF_TOKEN and HF_SPACE (e.g. user/extract-eval) exist.
name: Deploy Space
on:
  push:
    branches: [main]
    paths: ["space/**", "src/**"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ vars.HF_SPACE }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip when not configured
        if: env.HF_TOKEN == '' || env.HF_SPACE == ''
        run: echo "HF_TOKEN secret / HF_SPACE variable not set; skipping deploy."
      - name: Push to Space
        if: env.HF_TOKEN != '' && env.HF_SPACE != ''
        run: |
          cp -r examples space/examples
          cd space && git init -q -b main && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Deploy ${GITHUB_SHA::7}"
          git push -f "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
